<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPA | Production Test Report</title>
    <link rel="icon" href="https://raw.githubusercontent.com/abellrajuu/production-proscale-report/main/logo.ico">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f0f7fd;
            color: #0c2340;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .card {
            background: #ffffff;
            padding: 32px 28px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 175, 239, 0.15);
            border: 1.5px solid rgba(0, 175, 239, 0.25);
            max-width: 380px;
            width: 90%;
        }
        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid #e0f2fe;
            border-top: 4px solid #00afef;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        h2 { font-size: 19px; margin-bottom: 8px; color: #0c2340; }
        p { font-size: 13px; color: #64748b; margin-bottom: 20px; line-height: 1.5; }
        .btn {
            display: inline-block;
            background: #00afef;
            color: #ffffff;
            padding: 10px 20px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 700;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="spinner" id="spinner"></div>
        <h2 id="title">Connecting to Production Server...</h2>
        <p id="status">Resolving 24/7 dedicated server link...</p>
        <div id="manualBtn" style="display:none;">
            <a href="#" id="directLink" class="btn">Click Here to Open Portal</a>
        
        <div style="margin-top: 16px; padding-top: 14px; border-top: 1px solid #e2e8f0;">
            <a href="ProductionReportApp.apk" class="btn" style="background: #10b981; display: inline-flex; align-items: center; gap: 8px;">
                <span>📥 Download Permanent Android APK</span>
            </a>
            <p style="margin-top: 8px; font-size: 11.5px; color: #94a3b8;">Never expires &bull; Auto-connects anywhere</p>
        </div>
</div>
    </div>

    <script>
        const NTFY_URL = "https://ntfy.sh/production_proscale_report_sys_9931/raw?poll=1";

        async function connect() {
            try {
                const res = await fetch(NTFY_URL, { cache: "no-store" });
                const text = await res.text();
                const lines = text.trim().split("\n").filter(l => l.trim().length > 0);
                if (lines.length > 0) {
                    const latest = lines[lines.length - 1].trim();
                    if (latest.startsWith("http")) {
                        document.getElementById("status").textContent = "Connected! Opening portal...";
                        document.getElementById("directLink").href = latest;
                        document.getElementById("manualBtn").style.display = "block";
                        window.location.replace(latest);
                        return;
                    }
                }
                throw new Error("No URL found");
            } catch (err) {
                console.error(err);
                document.getElementById("title").textContent = "Unable to Auto-Connect";
                document.getElementById("status").textContent = "Please check if your 24/7 server is online or try again.";
                document.getElementById("spinner").style.display = "none";
            }
        }

        connect();
    </script>
</body>
</html>
