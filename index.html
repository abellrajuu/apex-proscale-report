<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPA | Production Test Report</title>
    <link rel="icon" href="https://raw.githubusercontent.com/abellrajuu/apex-proscale-report/main/logo.ico">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f0f7fd;
            color: #0c2340;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
        }
        .card {
            background: #ffffff;
            padding: 32px 28px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 175, 239, 0.15);
            border: 1.5px solid rgba(0, 175, 239, 0.25);
            max-width: 400px;
            width: 100%;
        }
        .spinner {
            width: 44px;
            height: 44px;
            border: 3.5px solid #e0f2fe;
            border-top: 3.5px solid #00afef;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            margin: 0 auto 18px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        h2 { font-size: 19px; margin-bottom: 8px; color: #0c2340; font-weight: 800; }
        p { font-size: 13px; color: #64748b; margin-bottom: 20px; line-height: 1.5; }
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: #00afef;
            color: #ffffff;
            padding: 12px 24px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 700;
            font-size: 14px;
            box-shadow: 0 4px 14px rgba(0, 175, 239, 0.35);
            transition: all 0.2s ease;
        }
        .btn:hover { background: #0090c7; transform: translateY(-1px); }
        .btn-apk {
            background: #10b981;
            margin-top: 12px;
            box-shadow: 0 4px 14px rgba(16, 185, 129, 0.3);
        }
        .btn-apk:hover { background: #059669; }
    </style>
</head>
<body>
    <div class="card">
        <div class="spinner" id="spinner"></div>
        <h2 id="title">Opening Production Portal...</h2>
        <p id="status">Connecting directly to 24/7 dedicated server...</p>
        
        <div id="actionArea" style="margin-top: 15px;">
            <a href="https://62783d02020bd6.lhr.life/portal" id="directLink" class="btn">
                <span>🚀 Open Portal Now</span>
            </a>
            <div style="margin-top: 16px; padding-top: 16px; border-top: 1px solid #edf2f7;">
                <a href="ProductionReportApp.apk" class="btn btn-apk">
                    <span>📱 Download Android App (.APK)</span>
                </a>
            </div>
        </div>
    </div>

    <script>
        const NTFY_URL = "https://ntfy.sh/apex_proscale_report_sys_9931/raw?poll=1";
        const DEFAULT_URL = "https://62783d02020bd6.lhr.life/portal";

        // Fast redirect using cached or default URL
        const cached = localStorage.getItem("last_active_server_url") || DEFAULT_URL;
        document.getElementById("directLink").href = cached;

        // Immediately try fast redirect
        let redirected = false;
        function doRedirect(target) {
            if (!redirected && target) {
                redirected = true;
                localStorage.setItem("last_active_server_url", target);
                document.getElementById("status").textContent = "Redirecting to server...";
                window.location.replace(target);
            }
        }

        // Fetch live URL with 2.5s timeout
        const controller = new AbortController();
        const timeoutId = setTimeout(() => {
            controller.abort();
            doRedirect(cached);
        }, 2500);

        fetch(NTFY_URL, { cache: "no-store", signal: controller.signal })
            .then(res => res.text())
            .then(text => {
                clearTimeout(timeoutId);
                const lines = text.trim().split("\n").filter(l => l.trim().length > 0);
                if (lines.length > 0) {
                    const latest = lines[lines.length - 1].trim();
                    if (latest.startsWith("http")) {
                        doRedirect(latest);
                        return;
                    }
                }
                doRedirect(cached);
            })
            .catch(() => {
                doRedirect(cached);
            });
    </script>
</body>
</html>
