services:
  - type: web
    name: production-test-report
    env: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn backend_python:app
    envVars:
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: SESSION_LIFETIME_DAYS
        value: "30"
