<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPA Private Limited | Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
    <link rel="stylesheet" href="/static/css/style.css?v={{ build_version or 'v20260906v3' }}">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            background-color: #f8fafc;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        .login-card {
            background: #ffffff;
            border: 1.5px solid #e2e8f0;
            border-radius: 24px;
            padding: 44px 38px;
            max-width: 440px;
            width: 100%;
            box-shadow: 0 20px 30px -10px rgba(2, 132, 199, 0.12), 0 10px 15px -5px rgba(15, 23, 42, 0.04);
            position: relative;
        }

        .login-header {
            text-align: center;
            margin-bottom: 28px;
        }

        .login-header img {
            max-width: 180px;
            height: auto;
            margin-bottom: 16px;
        }

        .login-header h2 {
            font-family: 'Outfit', sans-serif;
            font-size: 20px;
            font-weight: 900;
            color: #0f172a;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            margin-top: 10px;
            margin-bottom: 4px;
        }

        .login-header p {
            font-size: 12.5px;
            color: #64748b;
            font-weight: 700;
            margin: 0;
            letter-spacing: 0.5px;
        }

        .form-control-custom {
            width: 100%;
            border: 1.5px solid #cbd5e1;
            border-radius: 12px;
            padding: 12px 16px;
            font-size: 14px;
            font-weight: 600;
            color: #0f172a;
            outline: none;
            transition: all 0.2s ease;
            box-shadow: 0 2px 6px rgba(15, 23, 42, 0.03);
        }

        .form-control-custom:focus {
            border-color: #0284c7;
            box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15);
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="login-header">
            <!-- OFFICIAL IPA PRIVATE LIMITED COMPANY LOGO FROM ipaindia.com -->
            <img src="/static/ipa_logo.png?v={{ build_version or 'v20260906v3' }}" alt="IPA Private Limited Logo">
            <h2>PRODUCTION REPORTING SYSTEM</h2>
            <p>WEIGHING & PROCESS AUTOMATION</p>
        </div>

        {% if error %}
        <div style="background: #fef2f2; color: #ef4444; border: 1px solid #fca5a5; padding: 12px 16px; border-radius: 10px; font-size: 13px; font-weight: 700; margin-bottom: 24px; text-align: center;">
            {{ error }}
        </div>
        {% endif %}

        <form action="/login" method="POST" autocomplete="off" style="display: flex; flex-direction: column;">
            <div class="input-group">
                <label style="font-weight: 700; color: #334155; font-size: 13px; margin-bottom: 6px; display: block;">User ID</label>
                <input type="text" name="username" id="username" class="form-control-custom" placeholder="" required autofocus autocomplete="username">
            </div>

            <div class="input-group" style="margin-top: 18px;">
                <label style="font-weight: 700; color: #334155; font-size: 13px; margin-bottom: 6px; display: block;">Password</label>
                <input type="password" name="password" id="password" class="form-control-custom" placeholder="" required autocomplete="current-password">
            </div>

            <button type="submit" style="width: 100%; justify-content: center; margin-top: 28px; padding: 14px; font-size: 15px; font-weight: 800; border-radius: 12px; background: linear-gradient(135deg, #0284c7, #2563eb); border: none; color: #ffffff; cursor: pointer; box-shadow: 0 4px 14px rgba(2, 132, 199, 0.3); font-family: 'Outfit', sans-serif; letter-spacing: 0.5px;">
                SIGN IN
            </button>
        </form>

        <div style="margin-top: 24px; text-align: center; border-top: 1px solid #e2e8f0; padding-top: 18px;">
            <a href="/download-app" style="display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-size: 13.5px; font-weight: 700; color: #16a34a; text-decoration: none; padding: 11px 20px; background: #f0fdf4; border: 1.5px solid #bbf7d0; border-radius: 12px; width: 100%; box-sizing: border-box; transition: all 0.2s; box-shadow: 0 2px 6px rgba(22, 163, 74, 0.1);">
                <i class="fa-solid fa-mobile-screen-button" style="font-size: 16px;"></i> Download Mobile App (APK)
            </a>
        </div>
    </div>

</body>
</html>
