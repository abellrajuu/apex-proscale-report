<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connecting to PRODUCTION TEST REPORT...</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: 'Plus Jakarta Sans', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 24px;
        }
        .card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 20px;
            padding: 32px 24px;
            width: 100%;
            max-width: 420px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }
        .logo-icon {
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, #0284c7, #2563eb);
            border-radius: 16px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            color: #ffffff;
            margin-bottom: 16px;
            box-shadow: 0 8px 20px rgba(2, 132, 199, 0.4);
        }
        h2 { font-family: 'Outfit', sans-serif; font-size: 20px; font-weight: 800; color: #f8fafc; margin-bottom: 6px; }
        p.subtitle { font-size: 13px; color: #94a3b8; margin-bottom: 24px; }
        .spinner {
            width: 44px;
            height: 44px;
            border: 4px solid rgba(56, 189, 248, 0.2);
            border-top-color: #38bdf8;
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
            margin: 0 auto 20px auto;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .status-msg { font-size: 14px; font-weight: 600; color: #38bdf8; margin-bottom: 20px; }
        .manual-box {
            display: none;
            margin-top: 16px;
            padding-top: 20px;
            border-top: 1px solid #334155;
            text-align: left;
        }
        .manual-box label { font-size: 12px; font-weight: 700; color: #94a3b8; margin-bottom: 6px; display: block; }
        .input-group { display: flex; gap: 8px; }
        .input-group input {
            flex: 1;
            background: #0f172a;
            border: 1px solid #475569;
            border-radius: 10px;
            padding: 10px 14px;
            color: #f8fafc;
            font-size: 14px;
            outline: none;
        }
        .input-group input:focus { border-color: #38bdf8; }
        .btn-connect {
            background: linear-gradient(135deg, #0284c7, #2563eb);
            border: none;
            color: #ffffff;
            padding: 10px 18px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="logo-icon">
            <i class="fa-solid fa-file-contract"></i>
        </div>
        <h2>PRODUCTION TEST REPORT</h2>
        <p class="subtitle">Industrial Production & Calibration Suite</p>

        <div class="spinner" id="spinner"></div>
        <div class="status-msg" id="statusMsg">Detecting active laptop server...</div>

        <div class="manual-box" id="manualBox">
            <label><i class="fa-solid fa-wifi"></i> Manual Laptop IP Address</label>
            <div class="input-group">
                <input type="text" id="customIpInput" placeholder="e.g. 10.199.141.77:5000" value="10.199.141.77:5000">
                <button type="button" class="btn-connect" onclick="connectCustomIp()">Connect</button>
            </div>
            <p style="font-size: 11px; color: #64748b; margin-top: 8px;">Ensure laptop and phone are on same Wi-Fi or connected over USB debugging.</p>
        </div>
    </div>

    <script>
        const savedIp = localStorage.getItem('apex_saved_ip');
        const candidateIps = [
            "http://127.0.0.1:5000",
            "http://192.168.1.21:5000",
            "http://10.0.2.2:5000",
            "http://10.199.141.77:5000",
            "http://192.168.100.191:5000",
            "http://192.168.137.1:5000"
        ];

        if (savedIp && !candidateIps.includes(savedIp)) {
            candidateIps.unshift(savedIp);
        }

        async function testServerIp(baseUrl) {
            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 2000);
                const res = await fetch(baseUrl + "/api/version", { signal: controller.signal });
                clearTimeout(timeoutId);
                if (res.ok) return true;
            } catch(e) {}
            return false;
        }

        async function autoDiscover() {
            const statusMsg = document.getElementById('statusMsg');
            const spinner = document.getElementById('spinner');
            const manualBox = document.getElementById('manualBox');

            for (let attempt = 1; attempt <= 3; attempt++) {
                statusMsg.textContent = `Connecting to server... (Attempt ${attempt}/3)`;
                for (const url of candidateIps) {
                    const isOk = await testServerIp(url);
                    if (isOk) {
                        localStorage.setItem('apex_saved_ip', url);
                        statusMsg.style.color = '#10b981';
                        statusMsg.innerHTML = '<i class="fa-solid fa-check-circle"></i> Connected! Opening Portal...';
                        setTimeout(() => {
                            window.location.replace(url + "/portal");
                        }, 300);
                        return;
                    }
                }
            }

            spinner.style.display = 'none';
            statusMsg.style.color = '#ef4444';
            statusMsg.innerHTML = '<i class="fa-solid fa-triangle-exclamation"></i> Server not found automatically.';
            manualBox.style.display = 'block';
        }

        async function connectCustomIp() {
            let inputVal = document.getElementById('customIpInput').value.trim();
            if (!inputVal) return;
            if (!inputVal.startsWith('http://') && !inputVal.startsWith('https://')) {
                inputVal = 'http://' + inputVal;
            }
            
            const statusMsg = document.getElementById('statusMsg');
            const spinner = document.getElementById('spinner');
            spinner.style.display = 'block';
            statusMsg.style.color = '#38bdf8';
            statusMsg.textContent = `Connecting to ${inputVal}...`;

            const isOk = await testServerIp(inputVal);
            if (isOk) {
                localStorage.setItem('apex_saved_ip', inputVal);
                statusMsg.style.color = '#10b981';
                statusMsg.innerHTML = '<i class="fa-solid fa-check-circle"></i> Connected! Opening Portal...';
                setTimeout(() => {
                    window.location.replace(inputVal + "/portal");
                }, 300);
            } else {
                spinner.style.display = 'none';
                statusMsg.style.color = '#ef4444';
                statusMsg.textContent = `Could not reach ${inputVal}. Check IP address and Wi-Fi.`;
            }
        }

        autoDiscover();
    </script>
</body>
</html>
