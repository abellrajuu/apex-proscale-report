<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Production Report</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .login-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-xl);
            padding: 44px 36px;
            max-width: 440px;
            width: 100%;
            box-shadow: var(--shadow-lg);
            position: relative;
            overflow: hidden;
        }

        .login-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 5px;
            background: linear-gradient(90deg, #0284c7, #0ea5e9, #38bdf8);
        }

        .login-header {
            text-align: center;
            margin-bottom: 28px;
        }

        .login-brand-icon {
            width: 68px;
            height: 68px;
            background: linear-gradient(135deg, #0284c7, #0ea5e9);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            color: #ffffff;
            margin: 0 auto 16px;
            box-shadow: 0 6px 18px rgba(2, 132, 199, 0.3);
        }

        .login-header h2 {
            font-family: 'Outfit', sans-serif;
            font-size: 24px;
            font-weight: 800;
            color: var(--text-primary);
            letter-spacing: -0.4px;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="login-header">
            <div class="login-brand-icon">
                <i class="fa-solid fa-file-invoice"></i>
            </div>
            <h2>Production Report</h2>
        </div>

        {% if error %}
        <div style="background: var(--rose-light); color: #f43f5e; border: 1px solid var(--rose-primary); padding: 12px 16px; border-radius: 10px; font-size: 13px; font-weight: 700; margin-bottom: 24px; text-align: center;">
            {{ error }}
        </div>
        {% endif %}

        <form action="/login" method="POST" autocomplete="off">
            <div class="input-group">
                <label>User ID</label>
                <input type="text" name="username" id="username" placeholder="Enter User ID" required autofocus autocomplete="username">
            </div>

            <div class="input-group" style="margin-top: 16px;">
                <label>Password</label>
                <input type="password" name="password" id="password" placeholder="Enter Password" required autocomplete="current-password">
            </div>

            <button type="submit" class="btn-primary" style="width: 100%; justify-content: center; margin-top: 26px; padding: 14px; font-size: 15px; border-radius: 12px;">
                Sign In
            </button>
        </form>
    </div>


    <!-- NATIVE ANDROID BOTTOM NAVIGATION BAR -->
    <nav class="mobile-bottom-nav">
        <a href="/portal" class="mobile-nav-item active">
            <i class="fa-solid fa-house"></i>
            <span>Home</span>
        </a>
        <a href="/portal" class="mobile-nav-item">
            <i class="fa-solid fa-folder-open"></i>
            <span>Reports</span>
        </a>
        
        
    </nav>

    <script src="/static/js/app.js?v=1788174095"></script>
</body>
</html>
